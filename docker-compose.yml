services:
  postgres:
    image: postgres:16-alpine
    container_name: filingbot_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  ingestion:
    build: .
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8000
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  classification:
    build: .
    command: python -m workers.classification.main
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  notification:
    build: .
    command: python -m workers.notification.main
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  telegram_bot:
    build: .
    command: python -m telegram_bot.main
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
