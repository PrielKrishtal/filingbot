repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: strip-claude-attribution
        name: Strip Claude co-author attribution
        entry: sed -i "/^Co-authored-by:.*[Cc]laude/Id" --
        language: system
        stages: [commit-msg]
